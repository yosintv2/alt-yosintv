    <style>
        :root {
            --bg-color: #f4f5f6;       /* Clean Light Background */
            --text-color: #111111;     /* Dark Charcoal Text */
            --text-secondary: #666666; /* Muted Grey Text */
            --btn-bg: #ffffff;         /* Pure White Buttons */
            --btn-hover: #fafafa;      /* Soft White on Hover */
            --btn-border: #e4e7eb;     /* Subtly Defined Borders */
            --accent-color: #0055ff;   /* Vibrant Blue for Verified Badge */
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05); /* Soft premium shadow */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 580px; /* Standard Bio.link width */
            text-align: center;
        }

        /* Profile Section */
        .profile-section {
            margin-bottom: 24px;
        }

        .profile-img {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffffff;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .profile-name {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            letter-spacing: -0.5px;
        }

        .verified-badge {
            color: var(--accent-color);
            font-size: 18px;
        }

        .profile-bio {
            font-size: 14.5px;
            color: var(--text-secondary);
            font-weight: 400;
            line-height: 1.5;
            max-width: 440px;
            margin: 0 auto 20px auto;
        }

        /* Social Icons Section */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 32px;
        }

        .social-icons a {
            color: var(--text-color);
            font-size: 22px;
            transition: transform 0.2s ease, color 0.2s ease;
            text-decoration: none;
        }

        .social-icons a:hover {
            transform: scale(1.15);
            color: var(--accent-color);
        }

        /* Links Buttons Container */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 40px;
        }

        /* Individual Bio Link Button */
        .bio-link {
            background-color: var(--btn-bg);
            color: var(--text-color);
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid var(--btn-border);
            box-shadow: var(--shadow);
            cursor: pointer;
        }

        .bio-link:hover {
            background-color: var(--btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
        }

        /* Icon spacing inside buttons */
        .link-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .link-icon-left {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }

        .link-icon-right {
            font-size: 14px;
            color: var(--text-secondary);
            opacity: 0.5;
        }

        /* Footer Branding */
        .footer {
            margin-top: auto;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .footer a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
